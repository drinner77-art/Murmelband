<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murmelband</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#251B3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Murmelband">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Schrift lokal (Baloo 2, SIL OFL 1.1 – siehe OFL.txt), variable Schrift für alle Stärken */
@font-face{font-family:"Baloo 2";font-style:normal;font-weight:400 800;font-display:swap;src:url(baloo2-latin.woff2) format("woff2")}
/* Farbwelten: alle Flächenfarben hängen am Farbton --h (wird je 10 Level per JS umgestellt) */
:root{
  --h:265;
  --bg:hsl(var(--h) 47% 94%); --bg2:hsl(var(--h) 50% 88%); --ink:hsl(var(--h) 32% 19%); --muted:hsl(var(--h) 19% 46%);
  --well:hsl(var(--h) 45% 86%); --wall:hsl(var(--h) 45% 79%); --belt:hsl(var(--h) 24% 38%); --hole:hsl(var(--h) 29% 27%); --cupbg:#FFFFFF;
  --btn:hsl(var(--h) 32% 19%); --btn-ink:#FFFFFF; --sel:hsl(calc(var(--h) - 11) 100% 65%);
  --ws:45%; --wl:86%; --blob:.45;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:hsl(var(--h) 36% 17%); --bg2:hsl(var(--h) 39% 11%); --ink:hsl(var(--h) 62% 96%); --muted:hsl(var(--h) 28% 73%);
    --well:hsl(var(--h) 32% 23%); --wall:hsl(var(--h) 27% 29%); --belt:hsl(var(--h) 26% 32%); --hole:hsl(var(--h) 37% 14%); --cupbg:hsl(var(--h) 30% 26%);
    --btn:hsl(var(--h) 62% 96%); --btn-ink:hsl(var(--h) 36% 17%); --sel:hsl(calc(var(--h) - 9) 100% 80%);
    --ws:32%; --wl:23%; --blob:.22; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:hsl(var(--h) 36% 17%); --bg2:hsl(var(--h) 39% 11%); --ink:hsl(var(--h) 62% 96%); --muted:hsl(var(--h) 28% 73%);
  --well:hsl(var(--h) 32% 23%); --wall:hsl(var(--h) 27% 29%); --belt:hsl(var(--h) 26% 32%); --hole:hsl(var(--h) 37% 14%); --cupbg:hsl(var(--h) 30% 26%);
  --btn:hsl(var(--h) 62% 96%); --btn-ink:hsl(var(--h) 36% 17%); --sel:hsl(calc(var(--h) - 9) 100% 80%);
  --ws:32%; --wl:23%; --blob:.22; color-scheme:dark;
}
/* Hintergrund: zwei langsam wandernde, unscharfe Farbflecken */
body::before,body::after{content:"";position:fixed;z-index:-1;width:70vmax;height:70vmax;border-radius:50%;pointer-events:none;filter:blur(60px);opacity:var(--blob)}
body::before{left:-25vmax;top:-20vmax;background:hsl(calc(var(--h) + 40) 85% 70%);animation:drift1 26s ease-in-out infinite alternate}
body::after{right:-30vmax;bottom:-25vmax;background:hsl(calc(var(--h) - 50) 85% 68%);animation:drift2 32s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,22vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-20vmax,-15vmax) scale(.9)}}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;color:var(--ink);background-color:var(--bg);
  background:radial-gradient(120% 80% at 50% 0%,var(--bg) 40%,var(--bg2) 100%);
  font-family:"Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  display:flex;flex-direction:column;align-items:center;
}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px 0;width:100%;max-width:460px}
.level{font-size:1.6rem;font-weight:800;line-height:1;background:transparent;color:var(--ink);padding:6px 12px 6px 4px;display:flex;align-items:baseline}
.level::after{content:"▾";font-size:.9rem;color:var(--muted);margin-left:6px}
.level small{font-size:.9rem;font-weight:500;color:var(--muted);margin-right:6px}
button{font:inherit;font-weight:700;font-size:1rem;border:none;border-radius:999px;padding:8px 16px;background:var(--btn);color:var(--btn-ink);cursor:pointer;min-height:44px}
button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--wall)}
button:focus-visible,.block:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.status{color:var(--muted);font-size:.95rem;min-height:1.5em;text-align:center;padding:0 16px}
.status.warn{color:#E63946;font-weight:700}
.wrap{width:100%;max-width:460px;padding:0 10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;min-height:0}
#board{
  --cell:min(56px,calc((100vw - 64px) / 6));
  display:grid;grid-template-columns:repeat(6,var(--cell));grid-auto-rows:var(--cell);gap:5px;
  padding:10px;border-radius:22px;background:var(--wall);margin-top:0;
}
.cell{border-radius:12px;position:relative}
.cell.well{background:var(--well)}
.cell.void{background:transparent}
.block{
  position:absolute;left:2px;top:2px;width:calc(100% - 4px);height:calc(100% - 4px);border-radius:11px;background:var(--c);border:none;padding:0;cursor:pointer;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35);
  transition:transform .12s;
}
.block.closed{filter:none}
.block.hidden{background:var(--muted);color:var(--bg);font-weight:800;font-size:calc(var(--cell) * .5);display:flex;align-items:center;justify-content:center}
.block.open{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;padding:5px;background:color-mix(in srgb,var(--c) 70%,#000)}
.block.open span{border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.9) 0 10%,rgba(255,255,255,0) 30%),var(--c)}
.block.open:active{transform:scale(.92)}
.block.bad{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.block.flip{animation:flip .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes flip{0%{transform:perspective(200px) rotateY(90deg) scale(.8)}100%{transform:perspective(200px) rotateY(0) scale(1)}}
.funnel{width:56%;height:26px;background:var(--wall);clip-path:polygon(0 0,100% 0,58% 100%,42% 100%)}
canvas{display:block;width:100%;max-width:440px}
#fx{position:fixed;left:0;top:0;width:100vw;height:100vh;max-width:none;pointer-events:none;z-index:5}
#pt{position:fixed;left:0;top:0;width:100vw;height:100vh;max-width:none;pointer-events:none;z-index:40}
#probe{position:absolute;width:0;height:0;overflow:hidden}
footer{padding:6px 0 16px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#lvlDlg .card{max-width:420px;width:calc(100% - 32px);padding:22px 18px 18px;display:flex;flex-direction:column;max-height:calc(100% - 48px)}
#lvlGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;overflow-y:auto;padding:4px;margin:0 0 16px;min-height:0}
#lvlGrid button{padding:0;min-height:48px;border-radius:14px;background:hsl(var(--h) var(--ws) var(--wl));color:var(--ink);font-size:1.05rem}
#lvlGrid .welt{grid-column:1/-1;text-align:left;font-weight:700;font-size:.85rem;color:var(--muted);padding:6px 2px 0}
#lvlGrid .welt i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:hsl(var(--h) 70% 60%)}
#lvlGrid button.cur{background:var(--sel);color:var(--btn-ink)}
#lvlGrid button.neu{box-shadow:inset 0 0 0 3px var(--sel)}
#over,#lvlDlg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;background:color-mix(in srgb,var(--bg2) 75%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#over.show,#lvlDlg.show{display:flex}
.card{text-align:center;padding:28px 30px;border-radius:28px;background:var(--bg);box-shadow:0 20px 50px rgba(0,0,0,.25);max-width:300px}
.card h2{margin:0 0 4px;font-size:1.9rem;font-weight:800;line-height:1.1}
.card p{margin:0 0 18px;color:var(--muted)}
#over.show .card{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
#lvlDlg.show .card{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.block{transition:none}.block.bad,.block.flip,#over.show .card,#lvlDlg.show .card,body::before,body::after{animation:none}}
</style>
</head>
<body>
<header>
  <button class="level" id="lvlBtn" aria-haspopup="dialog" aria-label="Level wählen"><small>Level</small><span id="lvl">1</span></button>
  <button id="restart" class="ghost">Neu starten</button>
</header>
<div class="status" id="status" aria-live="polite"></div>
<div class="wrap" id="wrap">
  <div id="board" role="group" aria-label="Blöcke"></div>
  <canvas id="cv" aria-label="Förderband und Becher"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
</div>
<canvas id="pt" aria-hidden="true"></canvas>
<div id="probe" aria-hidden="true"></div>
<div id="over" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="card"><h2 id="ovTitle"></h2><p id="ovText"></p><div class="btns"><button id="ovBtn2" class="ghost"></button><button id="ovBtn"></button></div></div>
</div>
<div id="lvlDlg" role="dialog" aria-modal="true" aria-labelledby="lvlTitle">
  <div class="card"><h2 id="lvlTitle">Level wählen</h2><p id="lvlText"></p><div id="lvlGrid"></div>
    <div class="btns"><button id="lvlClose" class="ghost">Abbrechen</button><button id="lvlWeiter"></button></div></div>
</div>
<script>
(function(){
  var COLORS=["#E8202A","#FFD500","#1DB63A","#1F5BFF","#8B2BE2","#FF3FBF","#00D2E6","#FF7A00","#6B3E14","#FFFFFF"];
  var NAMES=["Rot","Gelb","Grün","Blau","Lila","Rosa","Türkis","Orange","Braun","Weiß"];
  var SLOTS=30, PER=9, CUP=3, NCOL=4, COLS=6;
  var $=function(id){return document.getElementById(id)};
  var board=$("board"), cv=$("cv"), ctx=cv.getContext("2d"), fx=$("fx"), fctx=fx.getContext("2d");
  var FREI=142;            // Levels bis hier sind in der Auswahl immer frei
  var level=1, maxLvl=1;   // maxLvl = höchstes erreichtes (spielbares) Level
  try{var s=parseInt(localStorage.getItem("murmelband-level"),10);if(s>0)level=s;
      var m=parseInt(localStorage.getItem("murmelband-max"),10);if(m>0)maxLvl=m;}catch(e){}
  maxLvl=Math.max(maxLvl,level);
  function frei(){return Math.max(maxLvl,FREI);}

  /* ---------- Farbwelten (je 10 Level) ---------- */
  var WELTEN=[["Lila",265],["Ozean",200],["Sonnenuntergang",18],["Wald",145],["Beere",330],["Nacht",232],["Sand",40],["Lagune",175]];
  function welt(lv){return WELTEN[Math.floor((lv-1)/10)%WELTEN.length];}
  var RM=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- Partikel (Funken, Splitter, Konfetti, Text) auf eigener Ebene über allem ---------- */
  var pt=$("pt"), pctx=pt.getContext("2d"), parts=[], MAXP=260, now=0, combo=0, lastCup=-9;
  function add(p){if(parts.length<MAXP)parts.push(p);}
  function funken(x,y,col,n){
    if(RM)return;
    for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=120+Math.random()*260;
      add({k:"s",x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,g:500,t:0,max:.5+Math.random()*.35,c:col,r:2+Math.random()*2.5});}
    add({k:"ring",x:x,y:y,t:0,max:.4,c:col,r:10});
  }
  function splitter(x,y,w,col){
    if(RM)return;
    for(var i=0;i<12;i++){var a=Math.random()*Math.PI*2,v=80+Math.random()*200;
      add({k:"q",x:x+(Math.random()-.5)*w*.6,y:y+(Math.random()-.5)*w*.6,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,g:900,t:0,max:.6+Math.random()*.3,c:col,r:3+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*14});}
    add({k:"ring",x:x,y:y,t:0,max:.35,c:col,r:w*.4});
  }
  function text(x,y,s,col){if(RM)return;add({k:"t",x:x,y:y,vx:0,vy:-70,g:0,t:0,max:1.1,c:col,s:s});}
  function konfetti(){
    if(RM)return;
    for(var i=0;i<140;i++)add({k:"c",x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*80,vy:120+Math.random()*160,g:120,t:0,max:3.2+Math.random(),
      c:COLORS[Math.floor(Math.random()*9)],r:4+Math.random()*4,rot:Math.random()*6,vr:(Math.random()-.5)*10,sw:Math.random()*6});
  }
  function drawParticles(dt){
    pctx.setTransform(dpr,0,0,dpr,0,0); pctx.clearRect(0,0,innerWidth,innerHeight);
    if(!parts.length)return;
    parts=parts.filter(function(p){p.t+=dt;return p.t<p.max;});
    parts.forEach(function(p){
      var k=p.t/p.max, a=1-k;
      if(p.k!=="ring"){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.vr)p.rot+=p.vr*dt;}
      pctx.globalAlpha=Math.max(0,a);
      if(p.k==="s"){pctx.fillStyle=p.c;pctx.beginPath();pctx.arc(p.x,p.y,p.r*(1-k*.5),0,7);pctx.fill();}
      else if(p.k==="ring"){pctx.strokeStyle=p.c;pctx.lineWidth=4*(1-k);pctx.beginPath();pctx.arc(p.x,p.y,p.r+k*40,0,7);pctx.stroke();}
      else if(p.k==="q"||p.k==="c"){
        if(p.k==="c"){p.vx+=Math.sin(p.t*4+p.sw)*30*dt;pctx.globalAlpha=Math.min(1,(p.max-p.t)*2);}
        pctx.save();pctx.translate(p.x,p.y);pctx.rotate(p.rot);pctx.fillStyle=p.c;
        if(p.k==="c")pctx.fillRect(-p.r,-p.r*.45,p.r*2,p.r*.9*Math.abs(Math.cos(p.t*6+p.sw)));else pctx.fillRect(-p.r/2,-p.r/2,p.r,p.r);
        pctx.restore();}
      else if(p.k==="t"){var sc=1+Math.sin(Math.min(k*4,1)*Math.PI)*.3;
        pctx.save();pctx.translate(p.x,p.y);pctx.scale(sc,sc);pctx.font="800 26px 'Baloo 2',sans-serif";pctx.textAlign="center";
        pctx.lineWidth=5;pctx.strokeStyle="rgba(0,0,0,.35)";pctx.strokeText(p.s,0,0);pctx.fillStyle=p.c;pctx.fillText(p.s,0,0);pctx.restore();}
    });
    pctx.globalAlpha=1;
  }
  function pause(p){paused=p;if(p){parts=[];pctx.clearRect(0,0,pt.width,pt.height);}}

  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  /* ---------- Level ---------- */
  function openSet(g){
    var R=g.length, reach={}, q=[], res={};
    for(var x=0;x<COLS;x++) if(g[R-1][x].t==="empty"){reach[(R-1)+","+x]=1;q.push([R-1,x]);}
    while(q.length){var p=q.shift();[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
      var y=p[0]+d[0],x=p[1]+d[1];
      if(y>=0&&y<R&&x>=0&&x<COLS&&!reach[y+","+x]&&g[y][x].t==="empty"){reach[y+","+x]=1;q.push([y,x]);}
    });}
    for(var y=0;y<R;y++)for(var x2=0;x2<COLS;x2++){
      if(g[y][x2].t!=="block")continue;
      var o=y===R-1||[[1,0],[-1,0],[0,1],[0,-1]].some(function(d){return reach[(y+d[0])+","+(x2+d[1])];});
      if(o)res[y+","+x2]=1;
    }
    return res;
  }

  function generate(l){
    var r=rng(l*7919+3), R=Math.min(4+Math.floor((l-1)/3),7), g, blocks;
    for(var tries=0;tries<40;tries++){
      g=[];
      for(var y=0;y<R;y++){var row=[];for(var x=0;x<COLS;x++){
        var v=(y===R-1&&x>0&&x<5)?false:r()<(l<=20?0.17:Math.max(0.06,0.17-(l-20)*0.004));
        row.push({t:v?"void":"cell"});
      }g.push(row);}
      var seen={},q=[];
      for(var x=0;x<COLS;x++)if(g[R-1][x].t==="cell"){seen[(R-1)+","+x]=1;q.push([R-1,x]);}
      while(q.length){var p=q.shift();[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
        var yy=p[0]+d[0],xx=p[1]+d[1];
        if(yy>=0&&yy<R&&xx>=0&&xx<COLS&&!seen[yy+","+xx]&&g[yy][xx].t==="cell"){seen[yy+","+xx]=1;q.push([yy,xx]);}
      });}
      blocks=[];
      for(y=0;y<R;y++)for(x=0;x<COLS;x++){
        if(g[y][x].t!=="cell")continue;
        if(!seen[y+","+x]){g[y][x]={t:"void"};continue;}
        if(r()<0.07&&y<R-1)g[y][x]={t:"empty"};else{g[y][x]={t:"block"};blocks.push(g[y][x]);}
      }
      if(blocks.length>=6)break;
    }
    var nC=Math.min(3+Math.floor((l-1)/2),COLORS.length), cl=[];
    for(var i=0;i<blocks.length;i++)cl.push(i%nC);
    shuffle(cl,r);
    blocks.forEach(function(b,i){b.c=cl[i];});
    for(y=0;y<R-1;y++)for(x=0;x<COLS;x++)if(g[y][x].t==="block"&&l>=3&&r()<(l<=20?0.2:Math.min(0.45,0.2+(l-20)*0.01)))g[y][x].hidden=true;

    // Lösbare Reihenfolge simulieren und daraus die Becher bauen
    var sim=g.map(function(row){return row.map(function(c){return {t:c.t,c:c.c};});}), seq=[];
    while(true){
      var op=Object.keys(openSet(sim)); if(!op.length)break;
      var k=op[Math.floor(r()*op.length)].split(",").map(Number);
      for(var j=0;j<PER/CUP;j++)seq.push(sim[k[0]][k[1]].c);
      sim[k[0]][k[1]]={t:"empty"};
    }
    var w=l<=20?Math.min(2+Math.floor(l/4),7):Math.min(7+Math.floor((l-20)/5),12);
    for(i=0;i<seq.length;i++){var jj=Math.min(seq.length-1,i+Math.floor(r()*w));var t=seq[i];seq[i]=seq[jj];seq[jj]=t;}
    var cols=[[],[],[],[]];
    seq.forEach(function(c){
      var m=Math.min.apply(null,cols.map(function(a){return a.length;}));
      var cand=cols.filter(function(a){return a.length===m;});
      cand[Math.floor(r()*cand.length)].push(c);
    });
    return {grid:g,cols:cols};
  }
  function shuffle(a,r){for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}}

  /* ---------- Zustand ---------- */
  var grid,cols,slots,balls,flyers,off,over,msgT=0,moves=0,paused=false;
  function startLevel(){
    paused=false; moves=0; combo=0; $("lvlDlg").classList.remove("show");
    try{localStorage.setItem("murmelband-max",String(maxLvl));}catch(e){}
    document.documentElement.style.setProperty("--h",welt(level)[1]); readTheme();
    var tc=document.querySelector('meta[name="theme-color"]'); if(tc)tc.content=theme.bg;
    var L=generate(level);
    SLOTS=level<=20?30:Math.max(20,30-Math.floor((level-20)/4));
    grid=L.grid; cols=L.cols.map(function(c){return c.map(function(x){return {c:x,fill:0,res:0,clr:0};});});
    slots=new Array(SLOTS).fill(null); balls=[]; flyers=[]; off=0; over=false;
    try{localStorage.setItem("murmelband-level",String(level));}catch(e){}
    $("over").classList.remove("show"); $("lvl").textContent=level;
    resize(); renderGrid(); setStatus();
  }

  function renderGrid(){
    var op=openSet(grid); board.innerHTML="";
    grid.forEach(function(row,y){row.forEach(function(c,x){
      var el=document.createElement("div");
      el.className="cell "+(c.t==="void"?"void":"well");
      if(c.t==="block"){
        var b=document.createElement("button"), isOpen=!!op[y+","+x];
        var flip=false; if(isOpen&&c.hidden){c.hidden=false;flip=true;}
        b.style.setProperty("--c",COLORS[c.c]);
        if(flip&&!RM)setTimeout(function(bb){return function(){bb.classList.add("flip");};}(b),0);

      var to=hole(fl.col,Math.max(0,cols[fl.col].indexOf(fl.cup)),fl.k), t=fl.t, x=fl.from[0]+(to[0]-fl.from[0])*t, y=fl.from[1]+(to[1]-fl.from[1])*t-Math.sin(t*Math.PI)*18;
      marble(x,y,G.mr+(G.cupH*.32-G.mr)*t,COLORS[fl.c],null,t*8,true);
    });
  }

  var last=0;
  function frame(t){var dt=Math.min((t-last)/1000,0.05);last=t;if(!paused){update(dt);draw();drawParticles(dt);}requestAnimationFrame(frame);}

  $("restart").onclick=restart;
  $("lvlBtn").onclick=openLevels;
  $("lvlClose").onclick=closeLevels;
  $("lvlDlg").addEventListener("click",function(e){if(e.target===this)closeLevels();});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("lvlDlg").classList.contains("show"))closeLevels();});
  window.addEventListener("resize",resize);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",readTheme);
  resize(); startLevel();
  requestAnimationFrame(function(t){last=t;requestAnimationFrame(frame);});
})();
</script>

if ("serviceWorker" in navigator) { window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script>
