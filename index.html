<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murmelband</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#251B3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Murmelband">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFE8F7; --bg2:#E2D6F1; --ink:#2B2140; --muted:#6E5F8A;
  --well:#D9CCEB; --wall:#C6B4E0; --belt:#5B4A7A; --hole:#3E3159; --cupbg:#FFFFFF;
  --btn:#2B2140; --btn-ink:#FFFFFF; --sel:#7B4DFF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#251B3A; --bg2:#1A1229; --ink:#F3EEFB; --muted:#B3A6CC;
    --well:#33284D; --wall:#43365F; --belt:#4A3C66; --hole:#1E1630; --cupbg:#3A2E55;
    --btn:#F3EEFB; --btn-ink:#251B3A; --sel:#B497FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#251B3A; --bg2:#1A1229; --ink:#F3EEFB; --muted:#B3A6CC;
  --well:#33284D; --wall:#43365F; --belt:#4A3C66; --hole:#1E1630; --cupbg:#3A2E55;
  --btn:#F3EEFB; --btn-ink:#251B3A; --sel:#B497FF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;color:var(--ink);background-color:var(--bg);
  background:radial-gradient(120% 80% at 50% 0%,var(--bg) 40%,var(--bg2) 100%);
  font-family:"Baloo 2",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  display:flex;flex-direction:column;align-items:center;
}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px 0;width:100%;max-width:460px}
.level{font-size:1.6rem;font-weight:800;line-height:1}
.level small{font-size:.9rem;font-weight:500;color:var(--muted);margin-right:6px}
button{font:inherit;font-weight:700;font-size:1rem;border:none;border-radius:999px;padding:8px 16px;background:var(--btn);color:var(--btn-ink);cursor:pointer;min-height:44px}
button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--wall)}
button:focus-visible,.block:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.status{color:var(--muted);font-size:.95rem;min-height:1.5em;text-align:center;padding:0 16px}
.status.warn{color:#E63946;font-weight:700}
.wrap{width:100%;max-width:460px;padding:0 10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;min-height:0}
#board{
  --cell:min(56px,calc((100vw - 64px) / 6));
  display:grid;grid-template-columns:repeat(6,var(--cell));grid-auto-rows:var(--cell);gap:5px;
  padding:10px;border-radius:22px;background:var(--wall);margin-top:0;
}
.cell{border-radius:12px;position:relative}
.cell.well{background:var(--well)}
.cell.void{background:transparent}
.block{
  position:absolute;inset:2px;border-radius:11px;background:var(--c);border:none;padding:0;cursor:pointer;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35);
  transition:transform .12s;
}
.block.closed{filter:saturate(.75) brightness(.92)}
.block.hidden{background:var(--muted);color:var(--bg);font-weight:800;font-size:calc(var(--cell) * .5);display:flex;align-items:center;justify-content:center}
.block.open{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;padding:5px;background:color-mix(in srgb,var(--c) 70%,#000)}
.block.open span{border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.9) 0 10%,rgba(255,255,255,0) 30%),var(--c)}
.block.open:active{transform:scale(.92)}
.block.bad{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.funnel{width:56%;height:26px;background:var(--wall);clip-path:polygon(0 0,100% 0,58% 100%,42% 100%)}
canvas{display:block;width:100%;max-width:440px}
footer{padding:6px 0 16px}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;background:color-mix(in srgb,var(--bg2) 75%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#over.show{display:flex}
.card{text-align:center;padding:28px 30px;border-radius:28px;background:var(--bg);box-shadow:0 20px 50px rgba(0,0,0,.25);max-width:300px}
.card h2{margin:0 0 4px;font-size:1.9rem;font-weight:800;line-height:1.1}
.card p{margin:0 0 18px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.block{transition:none}.block.bad{animation:none}}
</style>
</head>
<body>
<header>
  <div class="level"><small>Level</small><span id="lvl">1</span></div>
  <button id="restart" class="ghost">Neu starten</button>
</header>
<div class="status" id="status" aria-live="polite"></div>
<div class="wrap" id="wrap">
  <div id="board" role="group" aria-label="Blöcke"></div>
  <canvas id="cv" aria-label="Förderband und Becher"></canvas>
</div>
<div id="over" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="card"><h2 id="ovTitle"></h2><p id="ovText"></p><button id="ovBtn"></button></div>
</div>
<script>
(function(){
  var COLORS=["#E63946","#FFB703","#2DC653","#3A86FF","#9D4EDD","#FF70A6","#00C2D1","#F77F00","#8D5524","#EDE9F5"];
  var NAMES=["Rot","Gelb","Grün","Blau","Lila","Rosa","Türkis","Orange","Braun","Weiß"];
  var SLOTS=30, PER=9, CUP=3, NCOL=4, COLS=6;
  var $=function(id){return document.getElementById(id)};
  var board=$("board"), cv=$("cv"), ctx=cv.getContext("2d");
  var level=1;
  try{var s=parseInt(localStorage.getItem("murmelband-level"),10);if(s>0)level=s;}catch(e){}

  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  /* ---------- Level ---------- */
  function openSet(g){
    var R=g.length, reach={}, q=[], res={};
    for(var x=0;x<COLS;x++) if(g[R-1][x].t==="empty"){reach[(R-1)+","+x]=1;q.push([R-1,x]);}
    while(q.length){var p=q.shift();[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
      var y=p[0]+d[0],x=p[1]+d[1];
      if(y>=0&&y<R&&x>=0&&x<COLS&&!reach[y+","+x]&&g[y][x].t==="empty"){reach[y+","+x]=1;q.push([y,x]);}
    });}
    for(var y=0;y<R;y++)for(var x2=0;x2<COLS;x2++){
      if(g[y][x2].t!=="block")continue;
      var o=y===R-1||[[1,0],[-1,0],[0,1],[0,-1]].some(function(d){return reach[(y+d[0])+","+(x2+d[1])];});
      if(o)res[y+","+x2]=1;
    }
    return res;
  }

  function generate(l){
    var r=rng(l*7919+3), R=Math.min(4+Math.floor((l-1)/3),7), g, blocks;
    for(var tries=0;tries<40;tries++){
      g=[];
      for(var y=0;y<R;y++){var row=[];for(var x=0;x<COLS;x++){
        var v=(y===R-1&&x>0&&x<5)?false:r()<0.17;
        row.push({t:v?"void":"cell"});
      }g.push(row);}
      var seen={},q=[];
      for(var x=0;x<COLS;x++)if(g[R-1][x].t==="cell"){seen[(R-1)+","+x]=1;q.push([R-1,x]);}
      while(q.length){var p=q.shift();[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
        var yy=p[0]+d[0],xx=p[1]+d[1];
        if(yy>=0&&yy<R&&xx>=0&&xx<COLS&&!seen[yy+","+xx]&&g[yy][xx].t==="cell"){seen[yy+","+xx]=1;q.push([yy,xx]);}
      });}
      blocks=[];
      for(y=0;y<R;y++)for(x=0;x<COLS;x++){
        if(g[y][x].t!=="cell")continue;
        if(!seen[y+","+x]){g[y][x]={t:"void"};continue;}
        if(r()<0.07&&y<R-1)g[y][x]={t:"empty"};else{g[y][x]={t:"block"};blocks.push(g[y][x]);}
      }
      if(blocks.length>=6)break;
    }
    var nC=Math.min(3+Math.floor((l-1)/2),COLORS.length), cl=[];
    for(var i=0;i<blocks.length;i++)cl.push(i%nC);
    shuffle(cl,r);
    blocks.forEach(function(b,i){b.c=cl[i];});
    for(y=0;y<R-1;y++)for(x=0;x<COLS;x++)if(g[y][x].t==="block"&&l>=3&&r()<0.2)g[y][x].hidden=true;

    // Lösbare Reihenfolge simulieren und daraus die Becher bauen
    var sim=g.map(function(row){return row.map(function(c){return {t:c.t,c:c.c};});}), seq=[];
    while(true){
      var op=Object.keys(openSet(sim)); if(!op.length)break;
      var k=op[Math.floor(r()*op.length)].split(",").map(Number);
      for(var j=0;j<PER/CUP;j++)seq.push(sim[k[0]][k[1]].c);
      sim[k[0]][k[1]]={t:"empty"};
    }
    var w=Math.min(2+Math.floor(l/4),7);
    for(i=0;i<seq.length;i++){var jj=Math.min(seq.length-1,i+Math.floor(r()*w));var t=seq[i];seq[i]=seq[jj];seq[jj]=t;}
    var cols=[[],[],[],[]];
    seq.forEach(function(c){
      var m=Math.min.apply(null,cols.map(function(a){return a.length;}));
      var cand=cols.filter(function(a){return a.length===m;});
      cand[Math.floor(r()*cand.length)].push(c);
    });
    return {grid:g,cols:cols};
  }
  function shuffle(a,r){for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}}

  /* ---------- Zustand ---------- */
  var grid,cols,slots,balls,flyers,off,over,msgT=0;
  function startLevel(){
    var L=generate(level);
    grid=L.grid; cols=L.cols.map(function(c){return c.map(function(x){return {c:x,fill:0,res:0,clr:0};});});
    slots=new Array(SLOTS).fill(null); balls=[]; flyers=[]; off=0; over=false;
    try{localStorage.setItem("murmelband-level",String(level));}catch(e){}
    $("over").classList.remove("show"); $("lvl").textContent=level;
    renderGrid(); fitBoard(); setStatus();
  }

  function renderGrid(){
    var op=openSet(grid); board.innerHTML="";
    grid.forEach(function(row,y){row.forEach(function(c,x){
      var el=document.createElement("div");
      el.className="cell "+(c.t==="void"?"void":"well");
      if(c.t==="block"){
        var b=document.createElement("button"), isOpen=!!op[y+","+x];
        if(isOpen)c.hidden=false;
        b.style.setProperty("--c",COLORS[c.c]);
        if(c.hidden){b.className="block hidden";b.textContent="?";b.setAttribute("aria-label","Verdeckter Block");}
        else{
          b.className="block "+(isOpen?"open":"closed");
          b.setAttribute("aria-label",NAMES[c.c]+(isOpen?", frei":", blockiert"));
          if(isOpen)for(var i=0;i<9;i++)b.appendChild(document.createElement("span"));
        }
        b.onclick=function(){tap(y,x,b,isOpen);};
        el.appendChild(b);
      }
      board.appendChild(el);
    });});
  }

  function used(){return slots.filter(function(s){return s!==null;}).length+balls.length;}
  function setStatus(msg){
    var st=$("status");
    if(msg){st.textContent=msg;st.className="status warn";msgT=1.6;return;}
    if(msgT>0)return;
    var onBelt=used()-balls.length;
    st.textContent="Band: "+onBelt+" / "+SLOTS+(balls.length?" · Im Trichter: "+balls.length:"");
    st.className="status"+(balls.length&&onBelt===SLOTS?" warn":"");
  }
  function shake(b){b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");}

  function tap(y,x,b,isOpen){
    if(over)return;
    if(!isOpen){shake(b);return;}
    var c=grid[y][x].c, br=b.getBoundingClientRect(), cr=cv.getBoundingClientRect(), D=G.mr*2.05;
    var sx=Math.max(D*1.5,Math.min(W-D*1.5,br.left+br.width/2-cr.left)), sy=Math.min(br.top+br.height/2-cr.top,-D*1.5);
    for(var i=0;i<PER;i++){
      var bx=sx+(i%3-1)*D+(Math.random()-.5)*2, by=sy+(Math.floor(i/3)-1)*D;
      balls.push({x:bx,y:by,vx:(Math.random()-.5)*20,vy:60,c:c});
    }
    grid[y][x]={t:"empty"};
    renderGrid();
  }

  /* ---------- Band-Geometrie ---------- */
  var W,H,dpr,G={},theme={};
  function readTheme(){var cs=getComputedStyle(document.documentElement);["belt","hole","cupbg","ink","muted","well","wall"].forEach(function(k){theme[k]=cs.getPropertyValue("--"+k).trim();});}
  function resize(){
    dpr=window.devicePixelRatio||1;
    W=Math.min($("wrap").clientWidth-20,440);
    var beltH=70, by=105, cupTop=by+beltH+10, cupH=26, gap=6;
    H=cupTop+4.5*(cupH+gap);
    cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+"px"; cv.style.width=W+"px";
    var rr=beltH/2-14, yc=by+beltH/2, x0=8+beltH/2, x1=W-8-beltH/2, a=x1-x0;
    G={by:by,beltH:beltH,rr:rr,yc:yc,x0:x0,x1:x1,a:a,L:2*a+2*Math.PI*rr,cupTop:cupTop,cupH:cupH,gap:gap};
    G.sp=G.L/SLOTS; G.mr=Math.min(G.sp*0.42,9.5); G.entry=a/2;
    var cx=W/2, nw=G.mr*2.9, xl=cx-nw/2, xr=cx+nw/2, top=0, ny=by-24;
    var hx1=cx-G.mr*3.5, hx2=cx+G.mr*3.5, hy=ny-G.mr*4;
    G.gateY=by+16; G.f={cx:cx,nw:nw,xl:xl,xr:xr,top:top,ny:ny,hx1:hx1,hx2:hx2,hy:hy};
    G.segs=[[0,-3000,0,top],[0,top,hx1,hy],[hx1,hy,xl,ny],[xl,ny,xl,G.gateY],[xl,G.gateY,xr,G.gateY],[xr,G.gateY,xr,ny],[xr,ny,hx2,hy],[hx2,hy,W,top],[W,top,W,-3000]];
    G.pick=[];
    for(var c=0;c<NCOL;c++){var x=Math.max(x0,Math.min(x1,colX(c)));G.pick.push(a+Math.PI*rr+(x1-x));}
    readTheme();
    fitBoard();
  }
  function fitBoard(){
    var R=grid?grid.length:6, gp=5;
    var avail=$("wrap").clientHeight-H-6-20;
    var byH=(avail-gp*(R-1))/R, byW=(Math.min(window.innerWidth,460)-40-gp*5)/6;
    var c=Math.max(26,Math.floor(Math.min(56,byH,byW)));
    board.style.setProperty("--cell",c+"px");
  }
  function colX(c){return W*(c+.5)/NCOL;}
  function pos(s){
    var g=G; s=((s%g.L)+g.L)%g.L;
    if(s<g.a)return [g.x0+s,g.yc-g.rr];
    s-=g.a; if(s<Math.PI*g.rr){var t=-Math.PI/2+s/g.rr;return [g.x1+g.rr*Math.cos(t),g.yc+g.rr*Math.sin(t)];}
    s-=Math.PI*g.rr; if(s<g.a)return [g.x1-s,g.yc+g.rr];
    s-=g.a; var t2=Math.PI/2+s/g.rr; return [g.x0+g.rr*Math.cos(t2),g.yc+g.rr*Math.sin(t2)];
  }
  function cupRect(c,i){var cw=W/NCOL-12;return {x:colX(c)-cw/2,y:G.cupTop+i*(G.cupH+G.gap),w:cw,h:G.cupH};}
  function hole(c,j,k){var r=cupRect(c,j);return [r.x+r.w*(k+.5)/3,r.y+r.h/2];}

  /* ---------- Spiellogik pro Frame ---------- */
  var jamT=0;
  function physics(dt){
    var n=balls.length; if(!n){jamT=0;return;}
    var S=4,h=dt/S,g=1400,r=G.mr,D=2*r,E=0.08,VMAX=650,i,j,it,s;
    var mouth=function(b){return b.y>G.f.ny-r*3&&Math.abs(b.x-G.f.cx)<r*3;};
    var prio=function(b){return b.y-Math.abs(b.x-G.f.cx)*.6;};
    var near=function(b){return b.y>G.f.ny-r*4&&Math.abs(b.x-G.f.cx)<r*4;};
    if(readyBall()<0&&balls.some(function(b){return near(b)&&Math.abs(b.vx)+Math.abs(b.vy)<40;}))jamT+=dt;else jamT=0;
    if(jamT>0.3){var best=null,bd=1e9;for(i=0;i<n;i++){var q=balls[i],dd=Math.hypot(q.x-G.f.cx,q.y-G.f.ny);if(dd<bd){bd=dd;best=q;}}
      if(best){best.vx+=(G.f.cx-best.x)*10;best.vy+=120;}jamT=0;}
    for(s=0;s<S;s++){
      for(i=0;i<n;i++){var b=balls[i];b.vy+=g*h;b.vx*=0.999;b.vy*=0.999;
        var v=Math.hypot(b.vx,b.vy);if(v>VMAX){b.vx*=VMAX/v;b.vy*=VMAX/v;}
        b.x+=b.vx*h;b.y+=b.vy*h;}
      for(it=0;it<3;it++){
        for(i=0;i<n;i++){var a=balls[i];
          for(j=i+1;j<n;j++){var o=balls[j],dx=o.x-a.x,dy=o.y-a.y;
            if(dx>D||dx<-D||dy>D||dy<-D)continue;
            var d2=dx*dx+dy*dy;if(d2>=D*D)continue;
            if(d2<1e-6){dx=.1;dy=0;d2=.01;}
            var d=Math.sqrt(d2),nx=dx/d,ny=dy/d,wa=.5,wb=.5;
            if(mouth(a)&&mouth(o)){if(prio(a)>prio(o)){wa=0;wb=1;}else{wa=1;wb=0;}}
            var p=D-d;
            a.x-=nx*p*wa;a.y-=ny*p*wa;o.x+=nx*p*wb;o.y+=ny*p*wb;
            var rv=(o.vx-a.vx)*nx+(o.vy-a.vy)*ny;
            if(rv<0){var k=-(1+E)*rv;a.vx-=k*nx*wa;a.vy-=k*ny*wa;o.vx+=k*nx*wb;o.vy+=k*ny*wb;}
          }
        }
        for(i=0;i<n;i++){var bb=balls[i];
          for(j=0;j<G.segs.length;j++)wallHit(bb,G.segs[j],r,E);
          if(bb.x<r){bb.x=r;if(bb.vx<0)bb.vx=0;} if(bb.x>W-r){bb.x=W-r;if(bb.vx>0)bb.vx=0;}
          if(bb.y>G.f.ny){if(bb.x<G.f.xl+r){bb.x=G.f.xl+r;if(bb.vx<0)bb.vx=0;}if(bb.x>G.f.xr-r){bb.x=G.f.xr-r;if(bb.vx>0)bb.vx=0;}}
          if(bb.y>G.gateY-r){bb.y=G.gateY-r;if(bb.vy>0)bb.vy=0;}
        }
      }
    }
  }
  function wallHit(b,s,r,E){
    var dx=s[2]-s[0],dy=s[3]-s[1],t=((b.x-s[0])*dx+(b.y-s[1])*dy)/(dx*dx+dy*dy);
    t=Math.max(0,Math.min(1,t));
    var ex=b.x-(s[0]+t*dx),ey=b.y-(s[1]+t*dy),d=Math.hypot(ex,ey);
    if(d>=r||d<1e-6)return;
    var nx=ex/d,ny=ey/d;b.x+=nx*(r-d);b.y+=ny*(r-d);
    var vn=b.vx*nx+b.vy*ny;
    if(vn<0){b.vx-=(1+E)*vn*nx;b.vy-=(1+E)*vn*ny;b.vx*=0.985;b.vy*=0.985;}
  }
  function readyBall(){
    var best=-1,by=-1e9;
    balls.forEach(function(b,i){if(Math.abs(b.x-G.f.cx)<G.f.nw/2&&b.y>G.gateY-G.mr-5&&b.y>by){by=b.y;best=i;}});
    return best;
  }
  function target(c){
    var col=cols[c];
    for(var j=0;j<Math.min(col.length,4);j++){var f=col[j];if(f.fill+f.res<CUP)return f;}
    return null;
  }
  function crossed(target,prev,d){var v=((target-prev)%G.L+G.L)%G.L;return v>0&&v<=d;}
  function update(dt){
    if(msgT>0){msgT-=dt;if(msgT<=0)setStatus();}
    physics(dt);
    var d=(G.L/5.5)*dt; off=(off+d)%G.L;
    for(var i=0;i<SLOTS;i++){
      var p=(i*G.sp+off)%G.L, prev=p-d;
      if(slots[i]===null){
        if(balls.length&&crossed(G.entry,prev,d)){var rb=readyBall();if(rb>=0){slots[i]=balls[rb].c;balls.splice(rb,1);}}
        continue;
      }
      for(var c=0;c<NCOL;c++){
        var f=target(c);
        if(f&&f.c===slots[i]&&crossed(G.pick[c],prev,d)){
          flyers.push({from:pos(p),col:c,k:f.fill+f.res,cup:f,c:slots[i],t:0});
          f.res++; slots[i]=null; break;
        }
      }
    }
    flyers=flyers.filter(function(fl){
      fl.t+=dt/0.26;
      if(fl.t>=1){fl.cup.fill++;fl.cup.res--;if(fl.cup.fill===CUP)fl.cup.clr=0.0001;return false;}
      return true;
    });
    cols.forEach(function(col,ci){col.forEach(function(f){if(f.clr)f.clr+=dt;});cols[ci]=col.filter(function(f){return !(f.clr>0.4);});});
    setStatus();
    if(!over)checkEnd();
  }
  function checkEnd(){
    var left=cols.some(function(c){return c.length;});
    if(!left&&!balls.length&&slots.every(function(s){return s===null;})&&!flyers.length){
      over=true;
      setTimeout(function(){showOver("Level "+level+" geschafft!","Alle Becher sind voll.","Nächstes Level",function(){level++;startLevel();});},300);
      return;
    }
    if(flyers.length||cols.some(function(c){return c.some(function(f){return f.clr;});}))return;
    var fronts=cols.map(function(c,i){var t=target(i);return t?t.c:-1;});
    var match=slots.some(function(s){return s!==null&&fronts.indexOf(s)>=0;});
    if(match)return;
    var onBelt=slots.filter(function(s){return s!==null;}).length;
    if(balls.length){
      if(onBelt<SLOTS)return;
      over=true;
      setTimeout(function(){showOver("Band voll","Der Trichter staut sich und keine Murmel passt mehr in einen Becher.","Nochmal",startLevel);},400);
      return;
    }
    if(Object.keys(openSet(grid)).length>0)return;
    over=true;
    setTimeout(function(){showOver("Band blockiert","Keine Murmel passt mehr in einen Becher.","Nochmal",startLevel);},400);
  }
  function showOver(t,txt,btn,fn){$("ovTitle").textContent=t;$("ovText").textContent=txt;var b=$("ovBtn");b.textContent=btn;b.onclick=fn;$("over").classList.add("show");b.focus();}

  /* ---------- Zeichnen ---------- */
  function marble(x,y,r,col){
    var g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);
    g.addColorStop(0,"#fff");g.addColorStop(.25,col);g.addColorStop(1,shade(col));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  }
  function shade(h){var n=parseInt(h.slice(1),16);return "rgb("+((n>>16)*.6|0)+","+((n>>8&255)*.6|0)+","+((n&255)*.6|0)+")";}
  function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);}
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    var F=G.f;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W,F.top);ctx.lineTo(F.hx2,F.hy);ctx.lineTo(F.xr,F.ny);ctx.lineTo(F.xr,G.by+20);ctx.lineTo(F.xl,G.by+20);ctx.lineTo(F.xl,F.ny);ctx.lineTo(F.hx1,F.hy);ctx.lineTo(0,F.top);ctx.closePath();
    ctx.fillStyle=theme.well;ctx.fill();
    ctx.lineWidth=6;ctx.lineJoin="round";ctx.strokeStyle=theme.wall;
    ctx.beginPath();ctx.moveTo(3,0);ctx.lineTo(3,F.top);ctx.lineTo(F.hx1-3,F.hy);ctx.lineTo(F.xl-3,F.ny);ctx.lineTo(F.xl-3,G.by+6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(W-3,0);ctx.lineTo(W-3,F.top);ctx.lineTo(F.hx2+3,F.hy);ctx.lineTo(F.xr+3,F.ny);ctx.lineTo(F.xr+3,G.by+6);ctx.stroke();
    rrect(8,G.by,W-16,G.beltH,G.beltH/2); ctx.fillStyle=theme.belt; ctx.fill();
    ctx.strokeStyle=theme.hole; ctx.lineWidth=2; ctx.globalAlpha=.5;
    ctx.beginPath(); ctx.moveTo(G.x0,G.yc); ctx.lineTo(G.x1,G.yc); ctx.lineWidth=6; ctx.lineCap="round"; ctx.stroke(); ctx.globalAlpha=1;
    for(var i=0;i<SLOTS;i++){
      var p=pos(i*G.sp+off);
      if(slots[i]===null){ctx.fillStyle=theme.hole;ctx.beginPath();ctx.arc(p[0],p[1],G.mr*.75,0,7);ctx.fill();}
      else marble(p[0],p[1],G.mr,COLORS[slots[i]]);
    }
    balls.forEach(function(b){if(b.y>-G.mr)marble(b.x,b.y,G.mr,COLORS[b.c]);});
    for(var c=0;c<NCOL;c++){
      var col=cols[c];
      for(var j=0;j<Math.min(col.length,5);j++){
        var cup=col[j], r=cupRect(c,j), col1=COLORS[cup.c];
        ctx.save();
        if(cup.clr){var k=cup.clr/0.4;ctx.globalAlpha=1-k;ctx.translate(r.x+r.w/2,r.y+r.h/2);ctx.scale(1+k*.3,1+k*.3);ctx.translate(-(r.x+r.w/2),-(r.y+r.h/2));}
        rrect(r.x,r.y,r.w,r.h,10);
        if(j===0||cup.fill||cup.res){
          ctx.fillStyle=theme.cupbg;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=col1;ctx.stroke();
          for(var h=0;h<CUP;h++){var hp=hole(c,j,h);
            if(h<cup.fill)marble(hp[0],hp[1],G.cupH*.32,col1);
            else{ctx.globalAlpha=(cup.clr?1-cup.clr/0.4:1)*.3;ctx.fillStyle=col1;ctx.beginPath();ctx.arc(hp[0],hp[1],G.cupH*.27,0,7);ctx.fill();ctx.globalAlpha=cup.clr?1-cup.clr/0.4:1;}
          }
        }else{ctx.fillStyle=col1;ctx.fill();ctx.fillStyle="rgba(255,255,255,.28)";rrect(r.x+6,r.y+4,r.w-12,5,3);ctx.fill();}
        ctx.restore();
      }
      
    }
    flyers.forEach(function(fl){
      var to=hole(fl.col,Math.max(0,cols[fl.col].indexOf(fl.cup)),fl.k), t=fl.t, x=fl.from[0]+(to[0]-fl.from[0])*t, y=fl.from[1]+(to[1]-fl.from[1])*t-Math.sin(t*Math.PI)*18;
      marble(x,y,G.mr+(G.cupH*.32-G.mr)*t,COLORS[fl.c]);
    });
  }

  var last=0;
  function frame(t){var dt=Math.min((t-last)/1000,0.05);last=t;update(dt);draw();requestAnimationFrame(frame);}

  $("restart").onclick=startLevel;
  window.addEventListener("resize",resize);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",readTheme);
  resize(); startLevel();
  requestAnimationFrame(function(t){last=t;requestAnimationFrame(frame);});
})();
</script>

if ("serviceWorker" in navigator) { window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script>
